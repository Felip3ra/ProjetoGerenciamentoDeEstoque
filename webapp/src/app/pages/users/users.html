<div class="page">
  <header class="page-header">
    <div>
      <h1>Usuarios</h1>
      <p class="page-subtitle">12 usuario(s) encontrado(s)</p>
    </div>
    <button class="primary-button" type="button" (click)="showUserCreate()">
      <lucide-icon [name]="Plus" class="button-icon"></lucide-icon>
      Novo Usuario
    </button>
  </header>

  <section class="card search-card">
    <div class="search-field">
      <lucide-icon [name]="Search" class="search-icon" aria-hidden="true"></lucide-icon>
      <input type="text" placeholder="Buscar por nome, email ou setor..." />
    </div>
  </section>

  <section class="card table-card">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Email</th>
            <th>Setor</th>
            <th>Perfil</th>
            <th>Acesso</th>
            <th>Status</th>
            <th>Itens</th>
            <th class="align-right">Acoes</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Leticia Martins</td>
            <td>leticia@empresa.com</td>
            <td>Operacoes</td>
            <td><span class="badge badge-purple">ADMIN</span></td>
            <td><span class="badge badge-green">Com acesso</span></td>
            <td><span class="badge badge-green">Ativo</span></td>
            <td>
              <button class="link-button" type="button">
                <lucide-icon [name]="Package" class="link-icon"></lucide-icon>
                3 itens
              </button>
            </td>
            <td class="align-right">
              <div class="action-row">
                <button class="icon-button" type="button" title="Editar" (click)="showUserEdit()">
                  <lucide-icon [name]="Edit" class="icon"></lucide-icon>
                </button>
                <button class="icon-button" type="button" title="Deletar">
                  <lucide-icon [name]="Trash" class="icon"></lucide-icon>
                </button>
              </div>
            </td>
          </tr>
          <tr>
            <td>Joao Lima</td>
            <td>joao@empresa.com</td>
            <td>Administrativo</td>
            <td><span class="badge badge-blue">OPERADOR</span></td>
            <td><span class="badge badge-green">Com acesso</span></td>
            <td><span class="badge badge-green">Ativo</span></td>
            <td><span class="muted">0</span></td>
            <td class="align-right">
              <div class="action-row">
                <button class="icon-button" type="button" title="Editar" (click)="showUserEdit()">
                  <lucide-icon [name]="Edit" class="icon"></lucide-icon>
                </button>
                <button class="icon-button" type="button" title="Deletar">
                  <lucide-icon [name]="Trash" class="icon"></lucide-icon>
                </button>
              </div>
            </td>
          </tr>
          <tr>
            <td>Fernanda Alves</td>
            <td>fernanda@empresa.com</td>
            <td>TI</td>
            <td><span class="badge badge-gray">COLABORADOR</span></td>
            <td><span class="badge badge-gray">Sem acesso</span></td>
            <td><span class="badge badge-gray">Inativo</span></td>
            <td>
              <button class="link-button" type="button">
                <lucide-icon [name]="Package" class="link-icon"></lucide-icon>
                2 itens
              </button>
            </td>
            <td class="align-right">
              <div class="action-row">
                <button class="icon-button" type="button" title="Editar" (click)="showUserEdit()">
                  <lucide-icon [name]="Edit" class="icon"></lucide-icon>
                </button>
                <button class="icon-button" type="button" title="Deletar">
                  <lucide-icon [name]="Trash" class="icon"></lucide-icon>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>

<app-user-create-modal *ngIf="OpenUserCreate()" (close)="OpenUserCreate.set(false)"></app-user-create-modal>
<app-user-edit-modal *ngIf="OpenUserEdit()" (close)="OpenUserEdit.set(false)"></app-user-edit-modal>
