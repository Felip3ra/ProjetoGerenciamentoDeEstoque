<div class="login-page">
      <div class="login-card">
        <div class="login-icon-row">
          <div class="login-icon-bg">
            <lucide-icon
                [name]="LogInIcon"
                class="login-icon">
            </lucide-icon>
          </div>
        </div>
        
        <h1 class="login-title">Sistema de Gestão de Estoque</h1>
        <p class="login-subtitle">Faça login para continuar</p>

        <form class="login-form">
          <div>
            <label class="login-label">Email</label>
            <input
              type="email"
              placeholder="Digite seu e-mail"
              class="login-input"
            />
          </div>

          <div>
            <label class="login-label">Senha</label>
            <input
              type="password"
              placeholder="Digite sua senha"
              class="login-input"
            />
          </div>

          

          <button
            type="submit"
            class="login-submit"
          >
            Entrar
          </button>
        </form>

        
      </div>
    </div>
