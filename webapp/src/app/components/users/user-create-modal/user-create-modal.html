<div class="modal-overlay" (click)="close.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <header class="modal-header">
      <h2>Nova Pessoa</h2>
      <button class="icon-button" type="button" aria-label="Fechar" (click)="close.emit()">
        <lucide-icon [name]="CloseIcon" class="icon"></lucide-icon>
      </button>
    </header>

    <form class="modal-body">
      <div class="form-grid">
        <div>
          <label>
            Nome <span class="required">*</span>
          </label>
          <input type="text" placeholder="Ex: Leticia Martins" required />
        </div>

        <div>
          <label>Email</label>
          <input type="email" placeholder="exemplo@empresa.com" />
        </div>

        <div>
          <label>Setor</label>
          <input type="text" placeholder="Ex: Operacoes" />
        </div>
      </div>

      <div class="form-actions">
        <button class="button-ghost" type="button" (click)="close.emit()">Cancelar</button>
        <button class="button-primary" type="submit">Criar</button>
      </div>
    </form>
  </div>
</div>
