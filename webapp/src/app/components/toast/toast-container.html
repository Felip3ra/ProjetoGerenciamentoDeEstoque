<div class="toast-container">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast" [class.toast-success]="toast.type === 'success'" [class.toast-error]="toast.type === 'error'">
      <p class="toast-message">{{ toast.message }}</p>
      <button class="toast-close" type="button" (click)="toastService.dismiss(toast.id)">
        <lucide-icon [name]="CloseIcon" class="toast-icon"></lucide-icon>
      </button>
    </div>
  }
</div>
