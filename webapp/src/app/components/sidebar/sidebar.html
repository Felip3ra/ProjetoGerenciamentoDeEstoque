<aside class="sidebar">
  <div class="sidebar-header">
    <h2 class="sidebar-title">Gestão de Estoque</h2>
    <p class="sidebar-subtitle">Controle de Ativos</p>
  </div>

  <nav class="sidebar-nav">
    <a class="nav-link" routerLink="/dashboard" routerLinkActive="is-active">
      <span class="nav-icon" aria-hidden="true"
        ><lucide-icon [name]="LayoutDashboard" class="sidebar-icon"> </lucide-icon
      ></span>
      <span>Dashboard</span>
    </a>
    <a class="nav-link" routerLink="/items" routerLinkActive="is-active">
      <span class="nav-icon" aria-hidden="true"
        ><lucide-icon [name]="Package" class="sidebar-icon"> </lucide-icon
      ></span>
      <span>Itens</span>
    </a>
    <a class="nav-link" routerLink="/users" routerLinkActive="is-active">
      <span class="nav-icon" aria-hidden="true"
        ><lucide-icon [name]="Users" class="sidebar-icon"> </lucide-icon
      ></span>
      <span>Usuários</span>
    </a>
    <a class="nav-link" routerLink="/movements" routerLinkActive="is-active">
      <span class="nav-icon" aria-hidden="true"
        ><lucide-icon [name]="Movements" class="sidebar-icon"> </lucide-icon
      ></span>
      <span>Movimentações</span>
    </a>
    <a class="nav-link" routerLink="/reports" routerLinkActive="is-active">
      <span class="nav-icon" aria-hidden="true"
        ><lucide-icon [name]="Reports" class="sidebar-icon"> </lucide-icon
      ></span>
      <span>Relatórios</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-info">
      <div class="user-avatar" aria-hidden="true"></div>
      <div class="user-meta">
        <p class="user-name">Administrador</p>
        <span class="user-role">ADMIN</span>
      </div>
    </div>

    <button class="logout-button" type="button">Sair</button>
  </div>
</aside>
