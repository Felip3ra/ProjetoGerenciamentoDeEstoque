<div class="modal-overlay" (click)="close.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <header class="modal-header">
      <h3>Atribuir Item</h3>
      <button class="icon-button" type="button" aria-label="Fechar" (click)="close.emit()">
        <lucide-icon [name]="CloseIcon" class="icon"></lucide-icon>
      </button>
    </header>

    <form class="modal-body" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="item-summary">
        <p class="label">Item:</p>
        <p class="value">{{ item?.name || 'Item' }}</p>
        <p class="meta">Nº {{ item?.serialNumber || '-' }}</p>
        <p class="meta">Atualmente com: {{ item?.currentUser?.name || '-' }}</p>
      </div>

      @if (errorMessage) {
        <div class="alert error-alert">
          {{ errorMessage }}
        </div>
      }
      <div>
        <label>
          Atribuir para <span class="required">*</span>
        </label>
        <select formControlName="toUserId" required>
          <option [ngValue]="null">Selecione uma pessoa</option>
          @for (user of users; track user.id) {
            <option [ngValue]="user.id">{{ user.name }}</option>
          }
        </select>
      </div>

      <div>
        <label>Observação</label>
        <textarea rows="3" placeholder="Observações sobre esta movimentação" formControlName="observation"></textarea>
      </div>

      <div class="form-actions">
        <button class="button-ghost" type="button" (click)="close.emit()">Cancelar</button>
        <button class="button-primary" type="submit" [disabled]="isSubmitting || form.invalid">
          <span class="button-content">
            @if (isSubmitting) {
              <span class="button-spinner" aria-hidden="true"></span>
              Aguarde...
            } @else {
              Atribuir
            }
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
